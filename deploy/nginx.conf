# Load balancer in front of the API replicas. Docker's DNS returns every replica for "api".
upstream relay_api {
    server api:8000 max_fails=2 fail_timeout=5s;
    keepalive 32;
}
server {
    listen 80;
    client_max_body_size 64k;
    location /v1/ask/stream {
        proxy_pass http://relay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;              # Server-Sent Events: each verified claim goes out at once
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://relay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
